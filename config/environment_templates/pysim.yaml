schema_version: 1
kind: environment_template
key: pysim
name: PySim 环境
description: 连接 PySim 仿真服务
fields:
  - key: ip
    label: IP 地址
    type: ipv4
    required: true
    default: 127.0.0.1
  - key: port
    label: 端口
    type: integer
    required: true
    minimum: 1
    maximum: 65535
    default: 10001
runtime:
  dispatch_queue:
    name: scheme_play_pysim
    durable: true
  simulation_time_queue:
    name: scheme_sim_time_pysim
    durable: true
